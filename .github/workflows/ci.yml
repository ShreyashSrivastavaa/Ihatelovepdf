name: CI Quality & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint
        env:
          STRICT_LINT: "true"

      - name: Run Test Suite & Audits
        run: npm test

      - name: Verify Static Next.js Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify Static Export Artifacts
        run: |
          if [ ! -d "out" ] || [ ! -f "out/index.html" ]; then
            echo "::error::Static export failed - 'out/index.html' missing."
            exit 1
          fi
          echo "✅ Production static build verified successfully!"
